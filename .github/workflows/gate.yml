name: gate

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt

      # ─────────────────────────────────────────────────────────────────────
      # LEGACY COMBINED GATE — implemented, deliberately duplicating the four
      # split gates in quality.yml and testing.yml.
      #
      # The duplication is not an oversight. This check name is registered and
      # immutable; splitting or retiring it is a migration and needs approval.
      # So it runs the SAME proven commands rather than weaker approximations —
      # a legacy gate that checked less than its replacements would be a hollow
      # gate wearing a trusted name.
      # ─────────────────────────────────────────────────────────────────────

      - name: typecheck — mypy strict, zero errors
        env:
          PYTHONPATH: tools/ci:src
        run: mypy --no-incremental --cache-dir=/dev/null src tools/ci tests

      - name: lint — ruff, zero violations
        run: ruff check --no-fix --output-format=concise .

      - name: lint — formatting is not a matter of opinion
        run: ruff format --check .

      - name: tests — pytest, 100 percent passing
        env:
          PYTHONPATH: tools/ci:src
        run: |
          SEED="${GITHUB_RUN_ID}"
          echo "random seed: $SEED"
          pytest -p randomly --randomly-seed="$SEED"

      - name: build — sdist and wheel
        run: python3 -m build --outdir dist .

      - name: build — packaging metadata must be clean
        run: python3 -m twine check --strict dist/*

      - name: build — install into a clean environment and import it
        # The real assertion. A package that builds but ships no modules passes
        # every earlier step and fails here.
        run: |
          python3 -m venv /tmp/fresh-legacy
          # The ONLY network access in this step, and it happens before the
          # install, never during it. The package now declares a real runtime
          # dependency, and `--no-index` below cannot fetch one. Downloading it
          # into `dist` first keeps the install itself completely offline.
          /tmp/fresh-legacy/bin/pip download --quiet --dest dist pydantic==2.12.3
          /tmp/fresh-legacy/bin/pip install --quiet --no-index --find-links dist accountant-dad
          /tmp/fresh-legacy/bin/python -c "import accountant_dad; print(accountant_dad.__version__)"

  conformance:
    name: conformance suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: conformance suite
        # Every predicate, including the ID ablation test
        # (MVP_BUILD_VERIFY_FIX.md:50). An EMPTY registry fails: a suite that
        # runs zero controls passes vacuously, which is the false green the
        # harness exists to prevent.
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from accountant_dad.conformance import Enforcement
          from accountant_dad.conformance_registry import REGISTRY

          predicates = REGISTRY.by_enforcement(Enforcement.PREDICATE)
          if not predicates:
              raise SystemExit("FAIL: the conformance registry is empty")

          untested = REGISTRY.untested_predicates()
          if untested:
              raise SystemExit(f"FAIL: predicates with no negative control: {untested}")

          for finding in REGISTRY.failures():
              print(f"FAIL {finding.prohibition}: {finding.attribution} - {finding.detail}")
          if REGISTRY.failures():
              raise SystemExit(f"FAIL: {len(REGISTRY.failures())} conformance failure(s)")

          for item in REGISTRY.by_enforcement(Enforcement.REVIEW_ONLY):
              if item.expiry is None:
                  raise SystemExit(f"FAIL: {item.identifier} is review-only with no expiry")

          print(f"conformance: {len(predicates)} predicates, "
                f"{len(REGISTRY.controls)} controls, all ENFORCED")
          PY
          python3 -m pytest tests/unit/test_id_ablation.py -q

  negative-controls:
    name: negative controls 9 of 9
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: not implemented
        run: |
          echo "NOT IMPLEMENTED - negative controls 9 of 9 (legacy)"
          echo
          echo "BLOCKER: the nine hard negative control documents do not exist,"
          echo "and neither does the Input Engine that would refuse them."
          echo
          echo "The nine are specified in MEASUREMENT_FRAMEWORK.md section 3:"
          echo "  N1 proforma invoice      N6 invoice to a different company"
          echo "  N2 purchase order        N7 invoice with amounts blanked"
          echo "  N3 quotation             N8 blank page"
          echo "  N4 delivery challan      N9 photograph of unrelated content"
          echo "  N5 invoice stamped DUPLICATE"
          echo
          echo "NEEDS   the nine documents (P1) and Engine 1 (P4)"
          echo "PHASE   P1 collects them, P4 makes refusal testable"
          echo "SOURCE  MVP_BUILD_VERIFY_FIX.md section 2 condition 4"
          echo
          echo "If any control produces an accounting entry the whole run is"
          echo "VOID. That cannot be asserted before either half exists."
          exit 1
