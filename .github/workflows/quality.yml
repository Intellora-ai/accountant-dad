name: quality

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install build tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: build sdist and wheel
        run: python3 -m build --outdir dist .
      - name: packaging metadata must be clean
        # --strict turns packaging WARNINGS into failures. A missing description
        # or a bad long_description is a packaging defect, not a nit.
        run: python3 -m twine check --strict dist/*
      - name: install into a clean environment and import it
        # The real assertion. A package that builds but ships no modules passes
        # every earlier step and fails here.
        run: |
          python3 -m venv /tmp/fresh
          # The ONLY network access in this step, and it happens before the
          # install, never during it. The package now declares a real runtime
          # dependency, and `--no-index` below cannot fetch one. Downloading it
          # into `dist` first keeps the install itself completely offline.
          # `pip download` resolves the whole closure, so this one pinned line
          # brings pydantic_core, annotated-types, typing-extensions and
          # typing-inspection with it - all wheels, no sdists, so nothing is
          # compiled at install time.
          /tmp/fresh/bin/pip download --quiet --dest dist dist/accountant_dad-*.whl
          /tmp/fresh/bin/pip install --quiet --no-index --find-links dist accountant-dad
          /tmp/fresh/bin/python -c "import accountant_dad; print(accountant_dad.__version__)"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: Engine 1 dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-engine1.txt
      - name: the imported libraries are the pinned ones
        # SHADOW DEFENCE. Two distributions can install the same top-level
        # module. pip reports success, records both, and `import` resolves to
        # whichever landed last. Measured on this repository, not imagined:
        # `importlib.metadata.version("opencv-python")` returned 5.0.0.93 while
        # `cv2.__version__` returned 4.10.0. A guard written against installed
        # METADATA reports green straight through that. This one asks the
        # interpreter which distribution provides each module and what the
        # module reports as its own version.
        run: tools/ci/assert_imports_match_pins.sh python3 requirements-ci.txt requirements-engine1.txt
      - name: prove this gate can still fail
        # HOLLOW-GATE DEFENCE. Feed mypy a real type error; it MUST reject it.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-mypy
          printf 'def f() -> int:\n    return "not an int"\n' > /tmp/canary-mypy/bad.py
          if mypy --strict --no-incremental --cache-dir=/dev/null /tmp/canary-mypy; then
            echo "BLOCKED - typecheck gate is HOLLOW: it passed str-returned-as-int."
            exit 1
          fi
          # ─────────────────────────────────────────────────────────────
          # A CHECKER THAT REJECTS EVERYTHING PASSES THE TEST ABOVE TOO.
          # `if tool args; then fail; fi` reads EVERY non-zero exit as "rejected
          # as expected" — a missing binary (127), a segfault (139), an OOM kill
          # (137), a network error or an internal tool fault all look identical
          # to a genuine refusal. The half above proves only that the command
          # did not exit 0.
          #
          # So the clean case must be ACCEPTED. Both halves together prove the
          # tool RAN and DISCRIMINATED; either half alone proves nothing.
          # `tools/ci/run_ocr_tests.sh:221-231` is where this shape already
          # existed; it was the only canary in the repository that had it.
          # ─────────────────────────────────────────────────────────────
          printf 'def f() -> int:\n    return 1\n' > /tmp/canary-mypy/bad.py
          if ! mypy --strict --no-incremental --cache-dir=/dev/null /tmp/canary-mypy; then
            echo "BLOCKED - typecheck gate rejects CLEAN code. It would never pass,"
            echo "so a red from it says nothing about this repository."
            exit 1
          fi
          echo "canary rejected the bad and accepted the good - typecheck gate discriminates"
      - name: mypy strict, zero errors
        # --no-incremental --cache-dir=/dev/null: a cached mypy run is not
        # reproducible. Determinism costs a few seconds here.
        env:
          PYTHONPATH: tools/ci:src
        run: mypy --no-incremental --cache-dir=/dev/null src tools/ci tests
      - name: suppression budget - zero new escape hatches
        # SUPPRESSION DEFENCE. noqa / type: ignore / pragma: no cover are how a
        # gate gets hollowed one line at a time. The budget is ZERO NEW ones,
        # floored against the base branch so the count can only fall.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          count() {
            { grep -rEoh '# *(noqa|type: *ignore|pragma: *no cover)' "$1" 2>/dev/null || true; } | wc -l | tr -d ' '
          }
          HEAD_N=$(count .)
          git fetch --quiet origin "$BASE_REF"
          rm -rf /tmp/base-src && mkdir -p /tmp/base-src
          git archive "origin/$BASE_REF" 2>/dev/null | tar -x -C /tmp/base-src || true
          BASE_N=$(count /tmp/base-src)
          echo "suppressions on base branch : $BASE_N"
          echo "suppressions on this ref    : $HEAD_N"
          [ "$HEAD_N" -le "$BASE_N" ] || {
            echo "BLOCKED - suppressions increased. Fix the code, do not silence the check."
            exit 1; }
          echo "no new suppressions"
      - name: no bare type-ignore escape hatches
        # Anti-gaming. `# type: ignore` without a code silences everything.
        run: |
          if grep -rn --include='*.py' -E '#\s*type:\s*ignore\s*$' src tools tests; then
            echo "BLOCKED - bare '# type: ignore' found. Name the error code."
            exit 1
          fi
          echo "no bare type-ignore"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: prove this gate can still fail
        # HOLLOW-GATE DEFENCE. A gate that exits 0 is not proof it looked at
        # anything. secret scan reported green for hours while scanning nothing.
        # This feeds ruff a file with an obvious violation and REQUIRES a failure.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-lint
          printf 'import os\n' > /tmp/canary-lint/bad.py
          if ruff check --no-fix --isolated --select F /tmp/canary-lint; then
            echo "BLOCKED - lint gate is HOLLOW: it passed an unused import."
            exit 1
          fi
          # ─────────────────────────────────────────────────────────────
          # A CHECKER THAT REJECTS EVERYTHING PASSES THE TEST ABOVE TOO.
          # `if tool args; then fail; fi` reads EVERY non-zero exit as "rejected
          # as expected" — a missing binary (127), a segfault (139), an OOM kill
          # (137), a network error or an internal tool fault all look identical
          # to a genuine refusal. The half above proves only that the command
          # did not exit 0.
          #
          # So the clean case must be ACCEPTED. Both halves together prove the
          # tool RAN and DISCRIMINATED; either half alone proves nothing.
          # `tools/ci/run_ocr_tests.sh:221-231` is where this shape already
          # existed; it was the only canary in the repository that had it.
          # ─────────────────────────────────────────────────────────────
          printf 'import os\n\nprint(os.getcwd())\n' > /tmp/canary-lint/bad.py
          if ! ruff check --no-fix --isolated --select F /tmp/canary-lint; then
            echo "BLOCKED - lint gate rejects CLEAN code. It would never pass,"
            echo "so a red from it says nothing about this repository."
            exit 1
          fi
          echo "canary rejected the bad and accepted the good - lint gate discriminates"
      - name: ruff, zero violations
        # --no-fix so the gate reports rather than silently rewriting code.
        run: ruff check --no-fix --output-format=concise .
      - name: formatting is not a matter of opinion
        run: ruff format --check .
      - name: enabled rule set is a ratchet
        # Anti-gaming. Narrowing `select` in pyproject.toml is how a lint gate
        # gets quietly defeated. The rule set may only grow.
        #
        # The floor is DERIVED from the base branch, never a number written here
        # — the same mechanism the merge gate uses for gates themselves.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          # The base branch may predate pyproject.toml. Absent means an empty
          # rule set, so every rule reads as an addition rather than a crash.
          if git cat-file -e "origin/$BASE_REF:pyproject.toml" 2>/dev/null; then
            git show "origin/$BASE_REF:pyproject.toml" > /tmp/base-pyproject.toml
          else
            echo "" > /tmp/base-pyproject.toml
            echo "note: base branch has no pyproject.toml; treating rule set as empty"
          fi
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          def rules(path: str) -> set[str]:
              cfg = tomllib.loads(pathlib.Path(path).read_text())
              try:
                  return set(cfg["tool"]["ruff"]["lint"]["select"])
              except KeyError:
                  return set()

          base = rules("/tmp/base-pyproject.toml")
          head = rules("pyproject.toml")
          print(f"rule groups on base branch : {len(base)}")
          print(f"rule groups on this ref    : {len(head)}")
          for added in sorted(head - base):
              print(f"  ADDED   {added}")
          removed = sorted(base - head)
          if removed:
              print("BLOCKED - the lint rule set shrank. It may only grow.")
              for name in removed:
                  print(f"  REMOVED {name}")
              sys.exit(1)
          print("no lint rule removed")
          PY

  docker-build:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: not implemented
        run: |
          echo "NOT IMPLEMENTED - docker build"
          echo "BLOCKER: no Dockerfile exists and no locked document specifies a"
          echo "deployment target. This is the only gate with no basis in any"
          echo "architecture document. Needs a decision on whether the MVP ships"
          echo "as a container before it can be implemented."
          exit 1
