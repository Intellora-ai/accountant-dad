name: security

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:python

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        # ISOLATED ON PURPOSE. semgrep is a tool that INSPECTS this project, not
        # a dependency OF it. Installing it into requirements-ci.txt dragged its
        # own transitive packages (mcp, click) into the audited toolchain, and
        # `dependency scan` correctly flagged 4 advisories inside the inspector.
        # A scanner's internals are not this project's supply chain. Its own venv
        # keeps them out, while `dependency scan` still audits everything that
        # genuinely is a dependency. Nothing is ignored or suppressed.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --disable-pip-version-check --quiet semgrep==1.145.0
          /tmp/semgrep-venv/bin/semgrep --version
      - name: fetch the rule set at a PINNED commit
        # --config=p/python pulls live from the registry, so the same commit can
        # score differently on two runs. Pinning the official rule set to an
        # exact SHA makes this gate reproducible. No rule is authored here.
        env:
          RULES_SHA: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/semgrep/semgrep-rules.git /tmp/semgrep-rules
          git -C /tmp/semgrep-rules checkout --quiet "$RULES_SHA"
          echo "semgrep-rules pinned at $(git -C /tmp/semgrep-rules rev-parse HEAD)"
      - name: semgrep, zero ERROR findings
        run: |
          set -euo pipefail
          /tmp/semgrep-venv/bin/semgrep scan \
            --config /tmp/semgrep-rules/python \
            --severity ERROR \
            --error \
            --metrics off \
            --disable-version-check \
            --quiet \
            src tools tests

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. A secret committed and later .gitignore'd is still in
          # the history, and scanning only the diff would miss it entirely.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  dependency-scan:
    name: dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install pip-audit
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: prove this gate can still fail
        # HOLLOW-GATE DEFENCE. pip-audit MUST reject a package with a known
        # advisory. pytest 8.4.2 carries PYSEC-2026-1845, found by this very
        # gate on its first real run.
        run: |
          set -euo pipefail
          printf 'pytest==8.4.2\n' > /tmp/canary-req.txt
          if pip-audit --strict --requirement /tmp/canary-req.txt; then
            echo "BLOCKED - dependency scan is HOLLOW: it passed a known-vulnerable pin."
            exit 1
          fi
          # ─────────────────────────────────────────────────────────────
          # A CHECKER THAT REJECTS EVERYTHING PASSES THE TEST ABOVE TOO.
          # `if tool args; then fail; fi` reads EVERY non-zero exit as "rejected
          # as expected" — a missing binary (127), a segfault (139), an OOM kill
          # (137), a network error or an internal tool fault all look identical
          # to a genuine refusal. The half above proves only that the command
          # did not exit 0.
          #
          # So the clean case must be ACCEPTED. Both halves together prove the
          # tool RAN and DISCRIMINATED; either half alone proves nothing.
          # `tools/ci/run_ocr_tests.sh:221-231` is where this shape already
          # existed; it was the only canary in the repository that had it.
          # ─────────────────────────────────────────────────────────────
          printf '' > /tmp/canary-clean-req.txt
          if ! pip-audit --strict --requirement /tmp/canary-clean-req.txt; then
            echo "BLOCKED - dependency scan rejects a requirements file with no known"
            echo "advisory. It would never pass, so its red says nothing."
            exit 1
          fi
          echo "canary rejected the vulnerable and accepted the clean - dependency scan discriminates"
      - name: audit the CI toolchain
        # This gate is INTENTIONALLY non-deterministic, and that is correct.
        # The advisory database changes daily, so a dependency that was safe
        # yesterday and vulnerable today SHOULD turn the build red. The database
        # is never cached for the same reason.
        run: pip-audit --strict --requirement requirements-ci.txt
      - name: audit the package's own dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = cfg["project"]["dependencies"]
          print(f"declared runtime dependencies: {len(deps)}")
          for dep in deps:
              print(f"  {dep}")
          PY
          pip-audit --strict --progress-spinner off .
