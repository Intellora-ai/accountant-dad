name: testing

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: Engine 1 dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-engine1.txt
      - name: prove this gate can still fail
        # HOLLOW-GATE DEFENCE. A failing test MUST make pytest exit non-zero.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-pytest
          printf 'def test_canary() -> None:\n    assert 1 == 2\n' > /tmp/canary-pytest/test_c.py
          if pytest -p no:randomly -q /tmp/canary-pytest; then
            echo "BLOCKED - unit tests gate is HOLLOW: a failing test passed."
            exit 1
          fi
          echo "canary rejected as expected - unit tests gate is live"
      - name: pytest, 100 percent passing
        # Seed derived from the commit, not chosen: random ORDER catches
        # order-dependent tests, a fixed seed keeps the run reproducible.
        # xfail_strict is set in pyproject, so an xfail that unexpectedly
        # passes is a failure rather than a quiet green.
        env:
          PYTHONPATH: tools/ci:src
        run: |
          set -euo pipefail
          SEED=$(git rev-parse HEAD | head -c 8 | python3 -c "import sys; print(int(sys.stdin.read(), 16) % 4294967295)")
          echo "randomly-seed derived from commit: $SEED"
          pytest -p randomly --randomly-seed="$SEED" --junitxml=/tmp/junit.xml
      - name: tests must have ACTUALLY RUN
        # FAIL-CLOSED. pytest exits 0 when it collects zero tests. A deleted or
        # unimportable test directory would otherwise read as a pass.
        run: |
          set -euo pipefail
          COLLECTED=$(python3 -c "
          import re, pathlib
          x = pathlib.Path('/tmp/junit.xml').read_text()
          m = re.search(r'tests=\"(\d+)\"', x)
          print(m.group(1) if m else 0)
          ")
          echo "tests collected: $COLLECTED"
          [ "$COLLECTED" -gt 0 ] || {
            echo "BLOCKED - zero tests ran. A green suite that ran nothing is not a pass."
            exit 1; }
      - name: skip markers are a ratchet
        # Anti-gaming. Marking a failing test `skip` or `xfail` is the cheapest
        # way to turn this gate green. Counted in the SOURCE, which is where the
        # gaming happens, and floored against the base branch rather than a
        # number written here.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # grep exits 1 when there are no matches, which under pipefail would
          # fail the job. No skip markers is the GOOD case, so tolerate it.
          count_markers() {
            { grep -rEoh '@pytest\.mark\.(skip|skipif|xfail)' "$1" 2>/dev/null || true; } | wc -l | tr -d ' '
          }
          HEAD_SKIPS=$(count_markers tests)
          git fetch --quiet origin "$BASE_REF"
          rm -rf /tmp/base-tests && mkdir -p /tmp/base-tests
          if git ls-tree -r --name-only "origin/$BASE_REF" tests >/dev/null 2>&1; then
            git archive "origin/$BASE_REF" tests 2>/dev/null | tar -x -C /tmp/base-tests || true
          fi
          BASE_SKIPS=$(count_markers /tmp/base-tests)
          echo "skip/xfail markers on base branch : $BASE_SKIPS"
          echo "skip/xfail markers on this ref    : $HEAD_SKIPS"
          [ "$HEAD_SKIPS" -le "$BASE_SKIPS" ] || {
            echo "BLOCKED - skip/xfail markers increased. Fix the test, do not skip it."
            exit 1; }
          echo "no new skip markers"

  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: not implemented
        run: |
          echo "NOT IMPLEMENTED - integration tests"
          echo "BLOCKER: requires the six engines and a reachable test Tally."
          echo "Neither exists. MVP_BUILD_VERIFY_FIX.md and ADVERSARIAL_TESTING.md"
          echo "forbid substituting a mock, and a GitHub-hosted Linux runner"
          echo "cannot reach Tally on a private LAN. Blocked on infrastructure."
          exit 1

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: Engine 1 dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-engine1.txt
      - name: prove this gate can still fail
        # HOLLOW-GATE DEFENCE. An impossible floor MUST be rejected.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-cov && cd /tmp/canary-cov
          printf 'def unused(x):\n    if x:\n        return 1\n    return 2\n' > m.py
          printf 'import m\ndef test_t():\n    assert m.unused(1) == 1\n' > test_m.py
          coverage run --branch -m pytest -p no:randomly -q >/dev/null 2>&1 || true
          if coverage report --fail-under=100 >/dev/null 2>&1; then
            echo "BLOCKED - coverage gate is HOLLOW: partial coverage passed a 100% floor."
            exit 1
          fi
          echo "canary rejected as expected - coverage gate is live"
      - name: coverage floor is the HIGHER of 93 and the base branch's actual
        # LOWERED-THRESHOLD DEFENCE. The literal 93 is only a MINIMUM. The real
        # floor is whatever coverage the base branch already achieves, so the
        # number can never go down - editing 93 to 80 changes nothing while the
        # base branch sits at 94. Coverage becomes a one-way ratchet.
        env:
          PYTHONPATH: tools/ci:src
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          coverage run -m pytest -p no:randomly -q
          coverage json -o /tmp/head-cov.json >/dev/null
          export HEAD_PCT=$(python3 -c "import json;print(json.load(open('/tmp/head-cov.json'))['totals']['percent_covered'])")

          git fetch --quiet origin "$BASE_REF"
          rm -rf /tmp/base-tree
          git worktree add --quiet --detach /tmp/base-tree "origin/$BASE_REF"
          export BASE_PCT=0
          if [ -d /tmp/base-tree/tests ]; then
            ( cd /tmp/base-tree \
              && PYTHONPATH=tools/ci:src coverage run -m pytest -p no:randomly -q >/dev/null 2>&1 || true
              cd /tmp/base-tree && coverage json -o /tmp/base-cov.json >/dev/null 2>&1 || true )
            if [ -f /tmp/base-cov.json ]; then
              export BASE_PCT=$(python3 -c "import json;print(json.load(open('/tmp/base-cov.json'))['totals']['percent_covered'])")
            fi
          fi

          python3 - <<'PY'
          import os
          import sys

          head = float(os.environ["HEAD_PCT"])
          base = float(os.environ["BASE_PCT"])
          absolute_minimum = 93.0
          floor = max(absolute_minimum, base)
          print(f"absolute minimum      : {absolute_minimum:.1f}%")
          print(f"base branch actual    : {base:.2f}%")
          print(f"EFFECTIVE FLOOR       : {floor:.2f}%")
          print(f"this branch           : {head:.2f}%")
          if head + 1e-9 < floor:
              print("BLOCKED - coverage fell below the floor. It may only go up.")
              sys.exit(1)
          print("coverage held or improved")
          PY
      - name: no coverage exclusions
        # Anti-gaming. `# pragma: no cover` and exclude_lines are how a coverage
        # number gets manufactured. There are none, and there must stay none.
        run: |
          set -euo pipefail
          if grep -rn --include='*.py' 'pragma: no cover' src tools tests; then
            echo "BLOCKED - coverage exclusion found. Cover the code instead."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          excluded = cfg["tool"]["coverage"]["report"]["exclude_lines"]
          if excluded:
              print(f"BLOCKED - exclude_lines is not empty: {excluded}")
              sys.exit(1)
          print("no coverage exclusions")
          PY

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install tooling
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-ci.txt
      - name: Engine 1 dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-engine1.txt
      - name: mutation score at or above 93 percent
        # Coverage says a line RAN. Mutation says a bug in that line would be
        # CAUGHT. Tests that execute code without asserting score high on
        # coverage and near zero here — this is the gate coverage cannot be.
        #
        # ─────────────────────────────────────────────────────────────────
        # WHY THIS GATE REPORTED 0.0% FROM THE DAY IT WAS WRITTEN.
        #
        # It scored by counting the word "killed" in `mutmut results`. But
        # `mutmut results` is a SURVIVOR report — mutmut/__main__.py:1148:
        #
        #     if status == 'killed' and not all:
        #         continue
        #
        # Killed mutants are the one category it never prints. So the word
        # could never appear, `killed` was structurally 0, and the score was
        # structurally 0.0% — for ANY codebase, at ANY test quality. The
        # `0 killed / 351 survived` this gate reported was a reporting
        # artifact, never a measurement. `--all=1` is what prints kills.
        #
        # A FALSE CAUSE WAS COMMITTED HERE FIRST, in eaae515, and is
        # recorded so nobody re-derives it: this step used to set
        # `PYTHONPATH: tools/ci:src`, and that was blamed. It was innocent.
        # mutmut manages sys.path itself (__main__.py:971-982) — it prepends
        # `mutants/src` AND deletes the original `src`. The env var was
        # redundant, not harmful. It stays removed because it was redundant.
        #
        # What IS load-bearing is `pyproject.toml` in `[tool.mutmut]
        # also_copy`. pytest resolves `pythonpath` against the INI FILE's
        # directory — not rootdir — so without that copy pytest walks up to
        # the original pyproject, resolves against the ORIGINAL tree, and
        # every mutant silently survives. Guarded by
        # tests/unit/test_mutation_measures_the_real_tree.py.
        # ─────────────────────────────────────────────────────────────────
        run: |
          set -euo pipefail
          # Paths come from [tool.mutmut] in pyproject.toml. mutmut 3.3.1
          # deleted the --paths-to-mutate flag; passing it aborted the run, so
          # the gate scored zero mutants and blocked for a reason that was not
          # real — a broken invocation reading exactly like an unbuilt gate.
          mutmut run || true
          mutmut results --all=1
          python3 - <<'PY'
          import collections
          import subprocess
          import sys

          out = subprocess.run(
              ["mutmut", "browse", "--help"], capture_output=True, text=True, check=False
          )
          # `--all=1`, NOT `--all`. mutmut declares it as
          # `@click.option('--all', default=False)` with no `is_flag=True`, so
          # the bare form consumes the next argument instead of enabling it.
          res = subprocess.run(
              ["mutmut", "results", "--all=1"], capture_output=True, text=True, check=False
          )
          text = res.stdout + res.stderr
          print(text)

          # One mutant PER LINE, not one regex hit per word. mutmut prints
          # `    <mutant name>: <status>` and a mutant name can itself contain
          # a status word, so counting words counts the wrong things.
          tally = collections.Counter()
          for line in text.splitlines():
              name, sep, status = line.rpartition(": ")
              if sep and name.strip():
                  tally[status.strip()] += 1

          for status, count in sorted(tally.items()):
              print(f"  {status:32} {count}")

          killed = tally["killed"]
          survived = tally["survived"]
          total = killed + survived
          # Every status that is neither killed nor survived is named, never
          # folded into the denominator. A timeout is not a passing test and a
          # segfault is not a surviving mutant; counting either as one would
          # manufacture a score out of a broken run.
          unscoreable = sum(c for s, c in tally.items() if s not in ("killed", "survived"))
          if unscoreable:
              print(f"NOT SCOREABLE    : {unscoreable} mutant(s) neither killed nor survived")
          if total == 0:
              print("BLOCKED - mutmut produced no mutants to score.")
              sys.exit(1)
          score = 100.0 * killed / total
          print(f"mutants killed   : {killed}")
          print(f"mutants survived : {survived}")
          print(f"mutation score   : {score:.1f}%  (floor 93%)")
          if score < 93:
              print("BLOCKED - mutation score below 93 percent.")
              sys.exit(1)
          PY

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: not implemented
        run: |
          echo "NOT IMPLEMENTED - end-to-end"
          echo "BLOCKER: MVP_IMPLEMENTATION_BLUEPRINT.md line 41 declares"
          echo "'CLI, no UI'. Playwright drives a browser; there is nothing to"
          echo "drive and the blueprint says there will not be in this build."
          exit 1
